<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>TaskPro</title>
</head>
<body>
    <header>
        <div class="container">
            <div>
                <h1>TaskPro</h1>
            </div>

            <form id="form">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Digite sua tarefa..."
                    required
                />
                <button type="submit">Adicionar</button>
            </form>

            <button id="toggleTheme" title="Alternar modo claro/escuro">🌙</button>
        </div>
    </header>

    <section>
        <div class="container">
            <ul id="taskList"></ul>
        </div>
    </section>

    <script src="javascriptPuro.js"></script>
</body>
</html>
